schema_version: 1
contract_version: "2.0.0-mvp"

product_classes:
  "software": {section_title_ru: "Программное обеспечение"}
  "hardware": {section_title_ru: "Оборудование"}
  "cloud_service": {section_title_ru: "Облачные сервисы"}
  "subscription": {section_title_ru: "Подписки"}
  "certificate": {section_title_ru: "Сертификаты и электронная подпись"}
  "training/webinar": {section_title_ru: "Обучение и вебинары"}
  "other": {section_title_ru: "Прочее"}

price_units:
  per_user_year: "цена за пользователя в год"
  per_device_year: "цена за устройство в год"
  per_server_year: "цена за сервер в год"
  per_core_year: "цена за ядро в год"
  per_item: "цена за штуку / единицу лицензии"
  per_month_flat: "ежемесячная плата за ресурс или тариф"
  per_course: "цена за курс или мероприятие"

cross_sell_rules:
  complements:
    "software": ["software", "hardware", "subscription", "certificate", "cloud_service", "training/webinar"]
    "hardware": ["software", "hardware", "cloud_service", "subscription", "certificate"]
    "cloud_service": ["software", "cloud_service", "subscription", "training/webinar"]
    "subscription": ["software", "subscription", "cloud_service", "training/webinar"]
    "certificate": ["software", "hardware"]
    "training/webinar": ["software", "training/webinar"]
  upsell_to:
    "software": ["software", "subscription", "cloud_service"]
    "hardware": ["hardware", "subscription"]
    "cloud_service": ["cloud_service"]
    "subscription": ["subscription", "software"]
    "certificate": ["certificate"]
    "training/webinar": ["training/webinar"]
  analog_of:
    "software": ["software", "subscription", "cloud_service"]
    "subscription": ["subscription", "software", "cloud_service"]
    "cloud_service": ["cloud_service", "software", "subscription"]
    "hardware": ["hardware"]
    "certificate": ["certificate"]
    "training/webinar": ["training/webinar"]
  limits: {max_items_total: 6, max_per_relation: 3, max_per_source_type: 2}

head_noun_priors:
  "сервер": {default_product_type: server_hw, class_probs: {"hardware": 0.72, "cloud_service": 0.18, "software": 0.1}}
  "хранилище": {default_product_type: storage_san_nas, class_probs: {"hardware": 0.55, "cloud_service": 0.35, "software": 0.1}}
  "облако": {default_product_type: iaas_cloud, class_probs: {"cloud_service": 0.85, "subscription": 0.15}}
  "защита": {default_product_type: antivirus_endpoint, class_probs: {"software": 0.8, "hardware": 0.2}}
  "почта": {default_product_type: mail_collab_server, class_probs: {"software": 0.45, "subscription": 0.4, "cloud_service": 0.15}}
  "принтер": {default_product_type: printer_mfp, class_probs: {"hardware": 0.95, "software": 0.05}}
  "подпись": {default_product_type: ep_certificate, class_probs: {"certificate": 0.7, "software": 0.3}}
  "резервное копирование": {default_product_type: backup_software, class_probs: {"software": 0.65, "cloud_service": 0.35}}

